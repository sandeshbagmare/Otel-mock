# Collector config for the "real backends" stack. It fans every signal out to
# the 8 mock providers (as OTLP/JSON) AND to genuine, self-hostable open-source
# backends with real UIs:
#   * Jaeger      — traces  (UI :16686, real OTLP receiver)
#   * Zipkin      — traces  (UI :9411,  via the zipkin exporter)
#   * Prometheus  — metrics (UI :9090,  scrapes this collector's :8889)
#   * Grafana     — dashboards over Jaeger + Prometheus (UI :3000)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: normal

  # ---- mock providers (OTLP/JSON) ----
  otlphttp/sumologic: {endpoint: http://mockotel:5001, encoding: json, compression: none}
  otlphttp/datadog:   {endpoint: http://mockotel:5002, encoding: json, compression: none}
  otlphttp/newrelic:  {endpoint: http://mockotel:5003, encoding: json, compression: none}
  otlphttp/honeycomb: {endpoint: http://mockotel:5004, encoding: json, compression: none}
  otlphttp/grafanamock: {endpoint: http://mockotel:5005, encoding: json, compression: none}
  otlphttp/splunk:    {endpoint: http://mockotel:5006, encoding: json, compression: none}
  otlphttp/dynatrace: {endpoint: http://mockotel:5007, encoding: json, compression: none}
  otlphttp/elastic:   {endpoint: http://mockotel:5008, encoding: json, compression: none}

  # ---- real backends ----
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans
  prometheus:
    endpoint: 0.0.0.0:8889   # Prometheus scrapes this

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger, zipkin,
                  otlphttp/sumologic, otlphttp/datadog, otlphttp/newrelic,
                  otlphttp/honeycomb, otlphttp/grafanamock, otlphttp/splunk,
                  otlphttp/dynatrace, otlphttp/elastic]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus,
                  otlphttp/sumologic, otlphttp/datadog, otlphttp/newrelic,
                  otlphttp/honeycomb, otlphttp/grafanamock, otlphttp/splunk,
                  otlphttp/dynatrace, otlphttp/elastic]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,
                  otlphttp/sumologic, otlphttp/datadog, otlphttp/newrelic,
                  otlphttp/honeycomb, otlphttp/grafanamock, otlphttp/splunk,
                  otlphttp/dynatrace, otlphttp/elastic]
