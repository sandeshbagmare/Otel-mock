# Auto-provisioned Grafana datasources so the UI works out of the box at
# http://localhost:3000 (anonymous admin). Traces come from Jaeger, metrics
# from Prometheus.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
